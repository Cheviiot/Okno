[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Cheviiot/Okno"
rust-version = "1.85"

[workspace.dependencies]
okno-proto = { path = "crates/okno-proto" }
okno-net = { path = "crates/okno-net" }
okno-auth = { path = "crates/okno-auth" }
okno-discovery = { path = "crates/okno-discovery" }
okno-core = { path = "crates/okno-core" }
okno-codec = { path = "crates/okno-codec" }
okno-desktop = { path = "crates/okno-desktop" }
okno-audio = { path = "crates/okno-audio" }

anyhow = "1"
thiserror = "2"
bytes = "1"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
snow = "0.10"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
zeroize = "1"
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
mdns-sd = "0.13"
if-addrs = "0.14"
socket2 = "0.6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
tempfile = "3"
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Crypto and codecs are unusably slow unoptimised; our own crates stay debug.
[profile.dev.package."*"]
opt-level = 2
